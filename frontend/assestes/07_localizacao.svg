<svg xmlns="http://www.w3.org/2000/svg" width="640" height="460" viewBox="0 0 640 460" role="img" aria-labelledby="title desc" xml:lang="pt-BR">
  <title id="title">Localização do chamado</title>
  <desc id="desc">Marcador com um edifício pousa sobre um mapa simplificado do campus.</desc>
  <defs>
    <linearGradient id="halo" x2=".82" y2="1">
      <stop stop-color="#F0F6FF"/><stop offset="1" stop-color="#D7E6FF"/>
    </linearGradient>
    <linearGradient id="paper" x2=".7" y2="1">
      <stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E7F0FF"/>
    </linearGradient>
    <linearGradient id="accent" x2=".7" y2="1">
      <stop stop-color="#A9CCFF"/><stop offset="1" stop-color="#76ACFF"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-35%" width="180%" height="185%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#1D5FDB" flood-opacity=".15"/>
    </filter>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .lift { animation: lift 950ms cubic-bezier(.2,.75,.28,1) both; }
      .drop { animation: drop 920ms cubic-bezier(.22,.7,.32,1) both; }
      .slide { animation: slide 700ms cubic-bezier(.22,.7,.32,1) both; }
      .tick { animation: tick 960ms cubic-bezier(.22,.7,.32,1) both; }
      .draw { animation: draw 600ms ease-out both; }
      .bloom { animation: bloom 700ms cubic-bezier(.22,.7,.32,1) both; }
      .fade { animation: fade 700ms ease-out both; }
      .turn { animation: turn 950ms cubic-bezier(.22,.7,.32,1) both; }
      .d1 { animation-delay: 120ms; }
      .d2 { animation-delay: 240ms; }
      .d3 { animation-delay: 360ms; }
      .d4 { animation-delay: 480ms; }
    }
    @keyframes lift {
      from { transform: translateY(26px); opacity: .25; }
      67% { transform: translateY(-7px); opacity: 1; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes drop {
      from { transform: translateY(-29px); opacity: .2; }
      70% { transform: translateY(5px); opacity: 1; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes slide {
      from { transform: translateY(19px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes tick {
      from { transform: rotate(-100deg); }
      75% { transform: rotate(9deg); }
      to { transform: rotate(0); }
    }
    @keyframes draw {
      from { stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
      12% { opacity: 1; }
      to { stroke-dasharray: 1; stroke-dashoffset: 0; opacity: 1; }
    }
    @keyframes bloom {
      from { transform: scale(.7); opacity: 0; }
      72% { transform: scale(1.04); opacity: 1; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes turn {
      from { transform: rotate(-18deg); opacity: .3; }
      70% { transform: rotate(4deg); opacity: 1; }
      to { transform: rotate(0); opacity: 1; }
    }
  </style>
  <path d="M320 52c115 0 193 74 193 173s-77 169-193 169-193-68-193-169S205 52 320 52Z" fill="url(#halo)"/>
  <ellipse cx="320" cy="386" rx="144" ry="13" fill="#ADCFFF" opacity=".34"/>
  <g stroke-linecap="round" stroke-linejoin="round">
<g filter="url(#shadow)">
  <path d="m164 256 101-28 105 28 106-28v111l-106 32-105-32-101 29Z" fill="url(#paper)" stroke="#ABCFFF" stroke-width="5"/>
  <path d="M265 228v111m105-83v115" fill="none" stroke="#ABCFFF" stroke-width="4"/>
  <path d="m187 331 54-41 39 9 39 17 68 10 57-41" fill="none" stroke="#76ACFF" stroke-width="5" stroke-dasharray="7 11"/>
  <circle cx="319" cy="316" r="18" fill="#ABCFFF" opacity=".6"/>
</g>
<g class="drop">
  <path d="M319 90a83 83 0 0 0-83 83c0 49 58 104 83 130 25-26 83-81 83-130a83 83 0 0 0-83-83Z" fill="url(#paper)" stroke="#1D5FDB" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="319" cy="173" r="49" fill="#D7E6FF" stroke="#ABCFFF" stroke-width="4"/>
  <path d="M293 198v-36l26-17 26 17v36Z" fill="#FFFFFF" stroke="#1D5FDB" stroke-width="4"/>
  <path d="M312 198v-18h14v18" fill="#ADCFFF" stroke="#1D5FDB" stroke-width="4"/>
</g>
  </g>
</svg>
