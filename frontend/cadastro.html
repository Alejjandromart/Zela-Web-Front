<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criar conta | Zela</title>
  <link rel="stylesheet" href="./css/tokens.css">
  <link rel="stylesheet" href="./css/acesso.css">
  <script src="./js/acesso.js" defer></script>
</head>
<body>
  <div class="access-shell">
    <header class="signup-header">
      <a href="./login.html" aria-label="Voltar para o login">←</a>
      <span>Criar conta</span>
    </header>
    <main class="signup-main">
      <h1>Crie sua conta</h1>
      <p class="access-intro">Faça solicitações e acompanhe seus chamados.</p>

      <form class="access-form" id="form-cadastro" method="post">
        <div class="access-field">
          <label for="nome">Nome completo</label>
          <input id="nome" name="nome" maxlength="120" autocomplete="name" placeholder="Digite seu nome" required>
        </div>
        <div class="access-field">
          <label for="email">E-mail</label>
          <input id="email" name="email" maxlength="254" type="email" autocomplete="username" placeholder="seu.email@ufam.edu.br" required>
        </div>
        <div class="access-field">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="new-password" placeholder="De 4 a 8 caracteres" minlength="4" maxlength="8" required>
        </div>
        <div class="access-field">
          <label for="confirmar-senha">Confirmar senha</label>
          <input id="confirmar-senha" name="confirmarSenha" type="password" autocomplete="new-password" placeholder="Digite a senha novamente" minlength="4" maxlength="8" required>
        </div>
        <p class="access-note">Perfil de solicitante. Use dados fictícios para simular o cadastro.</p>
        <button class="access-button" type="submit" disabled>Criar minha conta</button>
      </form>
      <a class="access-link" href="./login.html">Já tenho uma conta · Entrar</a>
    </main>
  </div>
</body>
</html>
